<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOMShield Hybrid Side Panel</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        background: #090d16;
        color: #f8fafc;
        font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif;
      }
      .badge {
        display: inline-block;
        padding: 4px 8px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 700;
        background: rgba(16, 185, 129, 0.16);
        color: #10b981;
        border: 1px solid rgba(16, 185, 129, 0.4);
      }
      h1 {
        font-size: 16px;
        margin: 10px 0 6px;
      }
      p {
        font-size: 12px;
        color: #94a3b8;
        line-height: 1.5;
      }
      .btn {
        width: 100%;
        padding: 10px 12px;
        margin-top: 8px;
        border-radius: 8px;
        border: 1px solid #334155;
        background: #10b981;
        color: #090d16;
        font-weight: 700;
        cursor: pointer;
      }
      .btn-secondary {
        background: #1e293b;
        color: #f8fafc;
      }
      #output {
        margin-top: 12px;
        padding: 10px;
        border-radius: 8px;
        background: #111827;
        border: 1px solid #334155;
        font-size: 12px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <span class="badge">ON-DEVICE GEMINI NANO + FIREBASE AI LOGIC</span>
    <h1>DOMShield Hybrid Firewall</h1>
    <p>Zero-latency DOM dark-pattern &amp; phishing inspection with 0 bytes of PII sent to cloud on single-page scans.</p>
    <button id="scan-btn" class="btn">Scan Active Tab (On-Device Nano)</button>
    <button id="disarm-btn" class="btn btn-secondary">Disarm Dark Patterns in Page</button>
    <div id="output">Ready to inspect active tab DOM.</div>
    <script src="sidepanel.js"></script>
  </body>
</html>
